    return h;
  }

  function optionsHTML(opts, isOr){
    const field = isOr ? "oropt" : "opt";
    return '<div class="opts">' + ["a","b","c","d"].map((l, i) =>
      '<label class="opt"><span>' + l + ")</span>" +
      '<input data-qfield="' + field + '" data-oi="' + i + '" value="' + esc(opts[i] || "") +
      '" placeholder="Option ' + l + '"></label>'
    ).join("") + "</div>";
  }

  function subsEditorHTML(list, isOr){
    const orAttr = isOr ? ' data-or="1"' : "";
    const rows = list.map((t, i) =>
      '<div class="subrow">' +
        '<span class="lbl">(' + (ROMAN[i] || (i + 1)) + ")</span>" +
        '<textarea rows="1" data-qfield="sub" data-si="' + i + '"' + orAttr +
          ' placeholder="Subdivision (' + (ROMAN[i] || (i + 1)) + ') — multi-line allowed">' + esc(t) + "</textarea>" +
        '<button class="icon-btn danger" data-act="sub-del" data-si="' + i + '"' + orAttr +
          ' title="Remove subdivision">✕</button>' +
      "</div>"
    ).join("");
    return '<div class="subs">' + rows +
      '<button class="btn small" data-act="sub-add"' + orAttr + ">+ Add subdivision</button></div>";
  }

  function tableEditorHTML(tbl, target){
    const cols = tbl.rows[0] ? tbl.rows[0].length : 0;
    let rows = "";
    tbl.rows.forEach((row, ri) => {
      rows += "<tr>";
      for(let ci = 0; ci < cols; ci++){
        rows += '<td><input data-qcell="' + ri + "-" + ci + '" value="' + esc(row[ci] || "") + '"></td>';
      }
      rows += "</tr>";
    });
    return '<div class="tbleditor" data-tbltarget="' + (target === "or" ? "or" : "main") + '">' +
      '<div class="tb-tools">' +
        '<label class="check"><input type="checkbox" data-tbl="header"' + (tbl.header ? " checked" : "") +
          "> Header row</label>" +
        '<button class="tool" data-act="tbl-add-row">+ Row</button>' +
        '<button class="tool" data-act="tbl-add-col">+ Col</button>' +
        '<button class="tool" data-act="tbl-del-row">− Row</button>' +
        '<button class="tool" data-act="tbl-del-col">− Col</button>' +
        '<button class="tool remove" data-act="tbl-del" style="margin-left:auto">✕ Remove table</button>' +
      "</div>" +
      '<table class="tbl-edit">' + rows + "</table>" +
    "</div>";
  }

  function imageRow(q, isOr){
    const src = isOr ? q.orImage : q.image;
    const w = isOr ? q.orImageWidth : q.imageWidth;
    return '<div class="imgrow">' +
      '<img src="' + src + '" alt="">' +
      '<div class="imgmeta"><div class="range">Width ' +
        '<input type="range" min="3" max="17" step="0.5" value="' + w + '" data-qfield="' +
        (isOr ? "orImageWidth" : "imageWidth") + '">' +
        "<b>" + w + " cm</b></div></div>" +
      '<button class="btn small danger" data-act="img-del" data-or="' + (isOr ? 1 : 0) + '">✕ Remove image</button>' +
    "</div>";
  }

  function orBoxHTML(q, sec){
    return '<div class="orbox">' +
      '<div class="orhead"><span class="orlabel">OR alternative</span>' +
        '<button class="icon-btn danger" data-act="or-del" title="Remove OR alternative">✕</button></div>' +
      '<textarea data-qfield="orText" rows="2" placeholder="Alternative question (shown after OR)…">' +
        esc(q.orText) + "</textarea>" +
      (sec.type === "mcq" ? optionsHTML(q.orOptions || ["", "", "", ""], true) : "") +
      (q.orImage ? imageRow(q, true) : "") +
      (q.orTable ? tableEditorHTML(q.orTable, "or") : "") +
      '<div class="ortools">' +
        '<button class="tool tool-img' + (q.orImage ? " remove" : "") + '" data-act="q-or-img" title="' +
          (q.orImage ? "Remove the image from the OR alternative" : "Attach an image to the OR alternative") + '">' +
          (q.orImage ? "✕ Remove image" : "+ Add image") + "</button>" +
        '<button class="tool tool-subs' + (q.orSubparts.length ? " remove" : "") + '" data-act="or-subs" title="' +
          (q.orSubparts.length ? "Remove all subdivisions" : "Add subdivisions") + '">' +
          (q.orSubparts.length ? "✕ Remove subdivisions" : "+ Add subdivisions") + "</button>" +
        '<button class="tool tool-table' + (q.orTable ? " remove" : "") + '" data-act="or-table" title="' +
          (q.orTable ? "Remove the table from the OR alternative" : "Add a data table to the OR alternative") + '">' +
          (q.orTable ? "✕ Remove table" : "+ Add table") + "</button>" +
      "</div>" +
      (q.orSubparts.length ? subsEditorHTML(q.orSubparts, true) : "") +
    "</div>";
  }

  function qCardHTML(sec, q, qi, num){
    const isMcq = sec.type === "mcq";
    const hasImage = !!q.image;
    const hasOr = !!q.useOr;
    const hasSubs = q.subparts.length > 0;
    const hasTable = !!q.table;
    return '<div class="qcard" data-q="' + qi + '">' +
      '<div class="qhead">' +
        '<span class="qnum">' + num + "</span>" +
        '<span class="qtype">' + (TYPE_LABEL[sec.type] || "") + "</span>" +
        '<div class="qtools">' +
          '<button class="tool tool-img' + (hasImage ? " remove" : "") + '" data-act="q-img" title="' +
            (hasImage ? "Remove the image from this question" : "Attach an image to this question") + '">' +
            (hasImage ? "✕ Remove image" : "+ Add image") + "</button>" +
          '<button class="tool tool-or' + (hasOr ? " remove" : "") + '" data-act="q-or" title="' +
            (hasOr ? "Remove the OR alternative" : "Add an OR alternative question") + '">' +
            (hasOr ? "✕ Remove OR option" : "+ OR option") + "</button>" +
          '<button class="tool tool-subs' + (hasSubs ? " remove" : "") + '" data-act="q-subs" title="' +
            (hasSubs ? "Remove all subdivisions" : "Add subdivisions") + '">' +
            (hasSubs ? "✕ Remove subdivisions" : "+ Add subdivisions") + "</button>" +
          '<button class="tool tool-table' + (hasTable ? " remove" : "") + '" data-act="q-table" title="' +
            (hasTable ? "Remove the data table" : "Add a data table") + '">' +
            (hasTable ? "✕ Remove table" : "+ Add table") + "</button>" +
          '<button class="icon-btn danger qdel" data-act="q-del" title="Delete this question">✕</button>' +
        "</div>" +
      "</div>" +
      '<textarea data-qfield="text" rows="2" placeholder="Type the question here…">' + esc(q.text) + "</textarea>" +
      (q.image ? imageRow(q, false) : "") +
      (isMcq ? optionsHTML(q.options) : "") +
      (q.table ? tableEditorHTML(q.table, "main") : "") +
      (q.subparts.length ? subsEditorHTML(q.subparts, false) : "") +
      (q.useOr ? orBoxHTML(q, sec) : "") +
      '<input class="filehide" type="file" accept="image/*" data-imginput="main">' +
      '<input class="filehide" type="file" accept="image/*" data-imginput="or">' +
    "</div>";
  }

  function refreshQCard(sec, qi){
    const secEl = document.querySelector('.section-card[data-sid="' + sec.id + '"]');
    if(!secEl) return;
    const card = secEl.querySelector('.qcard[data-q="' + qi + '"]');
    if(!card) return;
    const si = state.sections.indexOf(sec);
    card.outerHTML = qCardHTML(sec, sec.questions[qi], qi, qStart(si) + qi + 1);
    autoGrowAll(secEl);
  }

  function renderAll(){
    renderMeta();
    renderInstr();
    renderSections();
  }

  /* ============================================================
     textarea auto-grow
     ============================================================ */
  function autoGrow(el){
    if(!el || el.tagName !== "TEXTAREA") return;
    el.style.height = "auto";
    el.style.height = Math.min(el.scrollHeight + 2, 340) + "px";
  }
  function autoGrowAll(root){
    $$("textarea", root).forEach(autoGrow);
  }

  /* ============================================================
     persistence
     ============================================================ */
  let saveTimer = null;
  let idleTimer = null;
  const saveEl = $("#savestate");

  function scheduleSave(){
    if(saveEl){
      saveEl.textContent = "Saving…";
      saveEl.classList.remove("ok", "warn");
    }
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
      try{
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        if(saveEl){
          saveEl.textContent = "Saved";
          saveEl.classList.add("ok");
        }
      }catch(e){
        if(saveEl){
          saveEl.textContent = "Not saved — browser storage is full";
          saveEl.classList.add("warn");
        }
      }
      clearTimeout(idleTimer);
      idleTimer = setTimeout(() => {
        if(saveEl){
          saveEl.textContent = "Auto-saves in this browser";
          saveEl.classList.remove("ok", "warn");
        }
      }, 1800);
    }, 380);
  }

  let toastTimer = null;
  function toast(msg){
    const el = $("#toast");
    if(!el) return;
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove("show"), 2300);
  }

  /* ============================================================
     images
     ============================================================ */
  function loadImg(src){
    return new Promise((resolve, reject) => {
      const im = new Image();
      im.onload = () => resolve(im);
      im.onerror = reject;
      im.src = src;
    });
  }

  async function readImageFile(file){
    if(!file) return null;
    if(!/^image\//.test(file.type)){
      alert("Please choose an image file.");
      return null;
    }
    const dataUrl = await new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onload = () => resolve(r.result);
      r.onerror = reject;
      r.readAsDataURL(file);
    });
    try{
      const im = await loadImg(dataUrl);
      const maxW = 1400;
      const nw = im.naturalWidth || im.width;
      const nh = im.naturalHeight || im.height;
      const scale = Math.min(1, maxW / Math.max(1, nw));
      const w = Math.max(1, Math.round(nw * scale));
      const hh = Math.max(1, Math.round(nh * scale));
      const canvas = document.createElement("canvas");
      canvas.width = w;
      canvas.height = hh;
      const ctx = canvas.getContext("2d");
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, w, hh);
      ctx.drawImage(im, 0, 0, w, hh);
      return canvas.toDataURL("image/jpeg", 0.9);
    }catch(e){
      return dataUrl;
    }
  }

  /* ============================================================
     click handlers
     ============================================================ */
  document.addEventListener("click", (e) => {
    const t = e.target.closest("[data-act]");
    if(!t) return;
    const act = t.dataset.act;
    const sec = sectionOf(t);
    const si = sec ? state.sections.indexOf(sec) : -1;
    const cardEl = t.closest(".qcard");
    const qi = cardEl ? +cardEl.dataset.q : -1;
    const q = (sec && qi >= 0) ? sec.questions[qi] : null;

    switch(act){
      case "sec-up":
      case "sec-down": {
        if(!sec) return;
        const target = act === "sec-up" ? si - 1 : si + 1;
        if(target < 0 || target >= state.sections.length) return;
        state.sections.splice(si, 1);
        state.sections.splice(target, 0, sec);
        renderSections();
        updatePreview();
        scheduleSave();
        break;
      }
      case "sec-del": {
        if(!sec) return;
        const label = "SECTION " + (LETTERS[si] || (si + 1));
        if(!confirm("Delete " + label + " and its " + sec.count + " question" + (sec.count === 1 ? "" : "s") + "?")) return;
        state.sections.splice(si, 1);
        renderSections();
        renderMeta();
        updatePreview();
        scheduleSave();
        break;
      }
      case "q-add": {
        if(!sec || sec.count >= 60) return;
        sec.count++;
        sec.questions.push(newQuestion(sec.type));
        renderSections();
        renderMeta();
        updatePreview();
        scheduleSave();
        const secEl = document.querySelector('.section-card[data-sid="' + sec.id + '"]');
        const cards = secEl ? $$(".qcard", secEl) : [];
        const last = cards[cards.length - 1];
        if(last){
          last.scrollIntoView({behavior:"smooth", block:"center"});
          const ta = $("textarea", last);
          if(ta) ta.focus();
        }
        break;
      }
      case "q-del": {
        if(!sec || !q) return;
        const hasContent = (q.text && q.text.trim()) || q.image || (q.orText && q.orText.trim()) ||
          q.orImage || q.table || q.subparts.some(v => v && v.trim()) ||
          q.orSubparts.some(v => v && v.trim());
        if(hasContent && !confirm("Remove this question?")) return;
        sec.questions.splice(qi, 1);
        sec.count = sec.questions.length;
        if(sec.count < 1){
          sec.count = 1;
          sec.questions.push(newQuestion(sec.type));
        }
        renderSections();
        renderMeta();
        updatePreview();
        scheduleSave();
        break;
      }
      case "q-img": {
        if(!q) return;
        if(q.image){
          q.image = null;
        }else{
          const inp = cardEl && $('[data-imginput="main"]', cardEl);
          if(inp) inp.click();
          return;
        }
        refreshQCard(sec, qi);
        updatePreview();
        scheduleSave();
        break;
      }
      case "q-or-img": {
        if(!q) return;
        if(q.orImage){
          q.orImage = null;
        }else{
          const inp = cardEl && $('[data-imginput="or"]', cardEl);
          if(inp) inp.click();
          return;
        }
        refreshQCard(sec, qi);
        updatePreview();
        scheduleSave();
        break;
      }
      case "q-or": {
        if(!q) return;
        if(q.useOr){
          const hasContent = (q.orText && q.orText.trim()) || q.orImage || hasAnyText(q.orSubparts);
          if(hasContent && !confirm("Remove the OR alternative and its content?")) return;
          q.useOr = false;
        }else{
          q.useOr = true;
        }
        refreshQCard(sec, qi);
        updatePreview();
        scheduleSave();
        break;
      }
      case "or-del": {
        if(!q) return;
        const hasOrContent = (q.orText && q.orText.trim()) || q.orImage || hasAnyText(q.orSubparts);
        if(hasOrContent && !confirm("Remove the OR alternative and its content?")) return;
        q.useOr = false;
        refreshQCard(sec, qi);
        updatePreview();
        scheduleSave();
        break;
      }
      case "q-subs": {
        if(!q) return;
        if(q.subparts.length){
          if(hasAnyText(q.subparts) && !confirm("Remove all subdivisions and their text?")) return;
          q.subparts = [];
        }else{
          q.subparts = ["", "", ""];
        }
        refreshQCard(sec, qi);
        updatePreview();
        scheduleSave();
        break;
      }
      case "sub-add": {
        if(!q) return;
        const isOr = t.dataset.or === "1";
        const arr = isOr ? q.orSubparts : q.subparts;
        if(arr.length >= 12) return;
        arr.push("");
        refreshQCard(sec, qi);
        updatePreview();
        scheduleSave();
        break;
      }
      case "sub-del": {
        if(!q) return;
        const isOr = t.dataset.or === "1";
        const arr = isOr ? q.orSubparts : q.subparts;
        arr.splice(+t.dataset.si, 1);
        refreshQCard(sec, qi);
        updatePreview();
        scheduleSave();
        break;
      }
      case "or-subs": {
        if(!q) return;
        if(q.orSubparts.length){
          if(hasAnyText(q.orSubparts) && !confirm("Remove all subdivisions and their text?")) return;
          q.orSubparts = [];
        }else{
          q.orSubparts = ["", "", ""];
        }
        refreshQCard(sec, qi);
        updatePreview();
        scheduleSave();
        break;
      }
      case "q-table": {
        if(!q) return;
        if(q.table){
          if(tableHasText(q.table) && !confirm("Remove this table and its content?")) return;
          q.table = null;
        }else{
          q.table = defaultTable(2, 4);
        }
        refreshQCard(sec, qi);
        updatePreview();
        scheduleSave();
        break;
      }
      case "or-table": {
        if(!q) return;
        if(q.orTable){
          if(tableHasText(q.orTable) && !confirm("Remove this table and its content?")) return;
          q.orTable = null;
        }else{
          q.orTable = defaultTable(2, 4);
        }
        refreshQCard(sec, qi);
        updatePreview();
        scheduleSave();
        break;
      }
      case "tbl-add-row": {
        if(!q) return;
        const tbl = tableFor(q, t);
        if(!tbl) return;
        const cols = tbl.rows[0].length;
        tbl.rows.push(Array.from({length: cols}, () => ""));
        refreshQCard(sec, qi);
        updatePreview();
        scheduleSave();
        break;
      }
      case "tbl-add-col": {
        if(!q) return;
        const tbl = tableFor(q, t);
        if(!tbl || tbl.rows[0].length >= 10) return;
        tbl.rows.forEach(r => r.push(""));
        refreshQCard(sec, qi);
        updatePreview();
        scheduleSave();
        break;
      }
      case "tbl-del-row": {
        if(!q) return;
        const tbl = tableFor(q, t);
        if(!tbl) return;
        if(tbl.rows.length > 1) tbl.rows.pop();
        refreshQCard(sec, qi);
        updatePreview();
        scheduleSave();
        break;
      }
      case "tbl-del-col": {
        if(!q) return;
        const tbl = tableFor(q, t);
        if(!tbl) return;
        if(tbl.rows[0].length > 1) tbl.rows.forEach(r => r.pop());
        refreshQCard(sec, qi);
        updatePreview();
        scheduleSave();
        break;
      }
      case "tbl-del": {
        if(!q) return;
        const wrap = t.closest("[data-tbltarget]");
        const key = (wrap && wrap.dataset.tbltarget === "or") ? "orTable" : "table";
        const tbl = q[key];
        if(tbl && tableHasText(tbl) && !confirm("Remove this table and its content?")) return;
        q[key] = null;
        refreshQCard(sec, qi);
        updatePreview();
        scheduleSave();
        break;
      }
      case "img-del": {
        if(!q) return;
        if(t.dataset.or === "1") q.orImage = null;
        else q.image = null;
        refreshQCard(sec, qi);
        updatePreview();
        scheduleSave();
        break;
      }
      case "instr-del": {
        state.instructions.splice(+t.dataset.i, 1);
        renderInstr();
        updatePreview();
        scheduleSave();
        break;
      }
      case "add-instr": {
        state.instructions.push("");
        renderInstr();
        const areas = $$("#instr-list textarea");
        if(areas.length) areas[areas.length - 1].focus();
        scheduleSave();
        break;
      }
      case "auto-instr": {
        addSectionSummary();
        break;
      }
      case "add-section": {
        const sec2 = mkSection({type:"short", marks:2, count:1});
        state.sections.push(sec2);
        renderSections();
        renderMeta();
        updatePreview();
        scheduleSave();
        requestAnimationFrame(() => {
          const el = document.querySelector('.section-card[data-sid="' + sec2.id + '"]');
          if(el) el.scrollIntoView({behavior:"smooth", block:"center"});
        });
        break;
      }
      case "export": {
        exportDoc();
        break;
      }
      case "print": {
        window.print();
        break;
      }
      case "reset": {
        if(!confirm("Clear this paper and start fresh? Everything you have typed will be removed.")) return;
        try{
          localStorage.removeItem(STORAGE_KEY);
        }catch(e){}
        state = defaultState();
        renderAll();
        updatePreview();
        toast("Started a fresh paper");
        break;
      }
    }
  });

  /* ============================================================
     input handlers (live typing, no re-render)
     ============================================================ */
  document.addEventListener("input", (e) => {
    const t = e.target;

    if(t.matches("[data-meta]")){
      if(t.type === "checkbox") return;
      state.meta[t.dataset.meta] = t.value;
      updatePreview();
      scheduleSave();
      return;
    }

    if(t.matches("[data-instr]")){
      state.instructions[+t.dataset.instr] = t.value;
      autoGrow(t);
      updatePreview();
      scheduleSave();
      return;
    }

    if(t.matches("[data-sattr]")){
      if(t.tagName === "SELECT") return;
      const sec = sectionOf(t);
      if(!sec) return;
      if(t.dataset.sattr === "marks"){
        sec.marks = Math.max(0, parseInt(t.value, 10) || 0);
        updatePreview();
        updateTotals();
      }
      return;
    }

    if(t.matches("[data-qfield]")){
      const sec = sectionOf(t);
      const card = t.closest(".qcard");
      if(!sec || !card) return;
      const q = sec.questions[+card.dataset.q];
      if(!q) return;
      const f = t.dataset.qfield;

      if(f === "text") q.text = t.value;
      else if(f === "orText") q.orText = t.value;
      else if(f === "opt") q.options[+t.dataset.oi] = t.value;
      else if(f === "oropt"){
        if(!Array.isArray(q.orOptions)) q.orOptions = ["", "", "", ""];
        q.orOptions[+t.dataset.oi] = t.value;
      }
      else if(f === "sub"){
        const arr = t.dataset.or === "1" ? q.orSubparts : q.subparts;
        arr[+t.dataset.si] = t.value;
      }else if(f === "imageWidth" || f === "orImageWidth"){
        q[f] = +t.value || 10;
        const b = t.parentElement ? $("b", t.parentElement) : null;
        if(b) b.textContent = t.value + " cm";
      }

      if(t.tagName === "TEXTAREA") autoGrow(t);
      updatePreview();
      scheduleSave();
      return;
    }

    if(t.matches("[data-qcell]")){
      const sec = sectionOf(t);
      const card = t.closest(".qcard");
      if(!sec || !card) return;
      const q = sec.questions[+card.dataset.q];
      const tbl = q && tableFor(q, t);
      if(!tbl) return;
      const parts = t.dataset.qcell.split("-");
      const ri = +parts[0], ci = +parts[1];
      if(tbl.rows[ri]) tbl.rows[ri][ci] = t.value;
      updatePreview();
      scheduleSave();
    }
  });

  /* ============================================================
     change handlers (structural)
     ============================================================ */
  document.addEventListener("change", async (e) => {
    const t = e.target;

    if(t.matches('[data-imginput]')){
      const sec = sectionOf(t);
      const card = t.closest(".qcard");
      if(!sec || !card || !t.files || !t.files[0]) return;
      const q = sec.questions[+card.dataset.q];
      if(!q) return;
      const isOr = t.dataset.imginput === "or";
      const data = await readImageFile(t.files[0]);
      t.value = "";
      if(!data) return;
      if(isOr) q.orImage = data;
      else q.image = data;
      refreshQCard(sec, +card.dataset.q);
      updatePreview();
      scheduleSave();
      toast(isOr ? "Image added to OR alternative" : "Image added to question");
      return;
    }

    if(t.matches('[data-meta="autoMarks"]')){
      if(!t.checked) state.meta.maxMarks = String(paperTotal());
      state.meta.autoMarks = t.checked;
      renderMeta();
      updatePreview();
      scheduleSave();
      return;
    }

    if(t.matches('[data-meta="endMark"]')){
      state.meta.endMark = t.checked;
      updatePreview();
      scheduleSave();
      return;
    }

    if(t.matches("[data-sattr]")){
      const sec = sectionOf(t);
      if(!sec) return;
      const k = t.dataset.sattr;

      if(k === "count"){
        let n = Math.max(1, Math.min(60, parseInt(t.value, 10) || 1));
        while(sec.questions.length < n) sec.questions.push(newQuestion(sec.type));
        while(sec.questions.length > n) sec.questions.pop();
        sec.count = n;
        renderSections();
        renderMeta();
        updatePreview();
        scheduleSave();
      }else if(k === "type"){
        sec.type = t.value;
        if(sec.type === "mcq"){
          sec.questions.forEach(q => {
            if(!Array.isArray(q.options) || q.options.length !== 4) q.options = ["", "", "", ""];
            if(!Array.isArray(q.orOptions) || q.orOptions.length !== 4) q.orOptions = ["", "", "", ""];
          });
        }
        if(sec.type === "case"){
          sec.questions.forEach(q => { if(!q.subparts.length) q.subparts = ["", "", ""]; });
        }
        if(sec.type !== "mcq") sec.optionsPerRow = 2;
        renderSections();
        updatePreview();
        scheduleSave();
      }else if(k === "marks"){
        sec.marks = Math.max(1, Math.min(100, parseInt(t.value, 10) || 1));
        renderSections();
        renderMeta();
        updatePreview();
        scheduleSave();
      }else if(k === "optionsPerRow"){
        sec.optionsPerRow = +t.value === 4 ? 4 : 2;
        updatePreview();
        scheduleSave();
      }
      return;
    }

    if(t.matches('[data-tbl="header"]')){
      const sec = sectionOf(t);
      const card = t.closest(".qcard");
      const q = sec && card ? sec.questions[+card.dataset.q] : null;
      const tbl = q && tableFor(q, t);
      if(tbl){
        tbl.header = t.checked;
        updatePreview();
        scheduleSave();
      }
    }
  });

  /* ============================================================
     instruction summary
     ============================================================ */
  function addSectionSummary(){
    const active = state.sections.filter(s => s.count > 0);
    if(!active.length) return;
    const total = active.reduce((a, s) => a + s.count, 0);
    const letters = active.map((s, i) => LETTERS[i]);
    const list = active.map((s, i) =>
      "Section " + LETTERS[i] + " comprises " + s.count + " question" + (s.count === 1 ? "" : "s") +
      " of " + s.marks + " mark" + (s.marks === 1 ? "" : "s") + " each"
    ).join(", ");
    state.instructions.push(
      "The question paper consists of " + total + " question" + (total === 1 ? "" : "s") +
      " divided into " + active.length + " section" + (active.length === 1 ? "" : "s") + " " +
      letters.join(", ") + ". " + list + "."
    );
    renderInstr();
    updatePreview();
    scheduleSave();
    toast("Section summary added");
  }

  /* ============================================================
     Word export (MHTML-based .doc — editable in Word)
     ============================================================ */
  function paperTitle(){
    const subject = String(state.meta.subject || "").replace(/^Subject\s*:\s*/i, "").trim();
    const exam = String(state.meta.exam || "").trim();
    return [exam, subject].filter(Boolean).join(" - ") || "Question Paper";
  }
  function fileSafe(name){
    return String(name).replace(/[\\/:*?"<>|]+/g, " ").replace(/\s+/g, " ").trim().slice(0, 80) || "Question Paper";
  }
  function downloadBlob(blob, name){
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
  }

  function exportDoc(){
    try{
      if(!window.PapercraftDocx) throw new Error("The Word exporter is not loaded.");
      const blob = window.PapercraftDocx.buildDocxBlob(state);
      downloadBlob(blob, fileSafe(paperTitle()) + ".docx");
      toast("Word file downloaded");
    }catch(err){
      console.error(err);
      alert("Could not export: " + err.message);
    }
  }

  /* ============================================================
     init
     ============================================================ */
  renderAll();
  updatePreview();
  requestAnimationFrame(() => {
    fitPreview();
    autoGrowAll(document);
  });

  let resizeTimer = null;
  window.addEventListener("resize", () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(fitPreview, 120);
  });
  window.addEventListener("beforeprint", fitPreview);

})();
